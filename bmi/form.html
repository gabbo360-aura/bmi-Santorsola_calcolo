<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore BMI</title>
    <style>
        body { font-family: sans-serif; background: #F1F3F5; display: flex; justify-content: center; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; width: 100%; max-width: 320px; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #1F2328; color: white; border: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Calcolatore BMI</h2>
    <form action="bmi.php" method="post">
        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Peso (kg)</label>
        <input type="number" step="0.1" name="peso" required>

        <label>Altezza (cm)</label>
        <input type="number" name="altezza" required>

        <button type="submit">Calcola</button>
    </form>
</div>

</body>
</html>
